package:
  name: extra-cmake-modules
  version: "6.19.0"
  epoch: 0
  description: Extra modules and scripts for CMake
  copyright:
    - license: LicenseRef-Callaway-BSD

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 67c974b0e34feee683f4d905dde33a2b6abac2f7
      repository: https://invent.kde.org/frameworks/extra-cmake-modules
      tag: v${{package.version}}

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: v

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development libraries and headers
